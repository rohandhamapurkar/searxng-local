name: searxng-local-test
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      - ./config:/etc/searxng
      - searxng-data:/var/cache/searxng
    restart: unless-stopped
  caddy:
    image: docker.io/library/caddy:2-alpine
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
      - '127.0.0.1:8888:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - searxng
    restart: unless-stopped
volumes:
  searxng-data:
  caddy-data:
  caddy-config:

name: searxng-local-test
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      - ./config:/etc/searxng
      - searxng-data:/var/cache/searxng
    networks:
      - local-apps
    restart: unless-stopped
networks:
  local-apps:
    external: true
volumes:
  searxng-data:
